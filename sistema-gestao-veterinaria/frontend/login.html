<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | VetCare</title><link rel="stylesheet" href="css/style.css"><script src="js/login.js" defer></script></head><body><header><a class="brand" href="index.html">VetCare</a><nav><a href="index.html">Início</a><a href="cadastro.html">Criar conta</a></nav></header><main class="login panel"><p class="eyebrow">Acesso ao sistema</p><h1>Entrar</h1><form id="login-form"><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password"></div><div class="actions"><button type="submit">Entrar</button></div><p id="message" class="message" role="status"></p></form><p class="small">O servidor e o banco MySQL precisam estar configurados e ativos.</p></main></body></html>
