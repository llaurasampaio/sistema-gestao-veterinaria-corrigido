<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animais | VetCare</title><link rel="stylesheet" href="css/style.css"><script src="js/common.js" defer></script><script src="js/animais.js" defer></script></head><body><header><a class="brand" href="dashboard.html">VetCare</a><nav><a href="dashboard.html">Painel</a><a href="tutores.html" data-roles="administrador,recepcionista">Tutores</a><a href="consultas.html">Consultas</a><a href="#" data-logout>Sair</a></nav></header><main><section class="panel" data-roles="administrador,recepcionista"><p class="eyebrow">Cadastro e CRUD</p><h1>Animais</h1><p class="small">Cadastrar, listar, editar e excluir conforme seu perfil de acesso.</p><form id="animal-form"><input type="hidden" id="animal-id"><div class="form-grid"><div class="field"><label for="nome">Nome *</label><input id="nome" required></div><div class="field"><label for="tutor_id">Tutor *</label><select id="tutor_id" required></select></div><div class="field"><label for="especie">Espécie *</label><input id="especie" required placeholder="Cão, gato..."></div><div class="field"><label for="raca">Raça</label><input id="raca"></div><div class="field"><label for="sexo">Sexo</label><select id="sexo"><option value="nao_informado">Não informado</option><option value="macho">Macho</option><option value="femea">Fêmea</option></select></div><div class="field"><label for="data_nascimento">Nascimento</label><input id="data_nascimento" type="date"></div><div class="field"><label for="peso_kg">Peso (kg)</label><input id="peso_kg" type="number" min="0.1" step="0.01"></div><div class="field"><label for="observacoes">Observações</label><input id="observacoes"></div></div><div class="actions"><button type="submit" data-roles="administrador,recepcionista">Salvar animal</button><button type="button" class="secondary" id="cancel-edit">Limpar</button></div><p id="message" class="message" role="status"></p></form></section><section class="panel"><h2>Animais cadastrados</h2><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Espécie</th><th>Tutor</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></body></html>
