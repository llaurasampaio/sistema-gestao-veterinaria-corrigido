<main><section class="panel"><p class="eyebrow">Administração</p><h1>Usuários do sistema</h1><p class="small">Cadastre recepcionistas e veterinários. A primeira conta de administrador é criada pela tela Criar conta.</p><form id="usuario-form"><div class="form-grid"><div class="field"><label for="nome">Nome completo *</label><input id="nome" required maxlength="120"></div><div class="field"><label for="email">E-mail *</label><input id="email" type="email" required maxlength="160"></div><div class="field"><label for="senha">Senha (mínimo 8 caracteres) *</label><input id="senha" type="password" minlength="8" required></div><div class="field"><label for="perfil">Perfil *</label><select id="perfil" required><option value="recepcionista">Recepcionista</option><option value="veterinario">Veterinário</option></select></div></div><div class="actions"><button type="submit">Cadastrar usuário</button></div><p id="message" class="message" role="status"></p></form></section></main></body></html>
